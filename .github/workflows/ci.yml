# Cada job chama `make` — os mesmos comandos de quem desenvolve (ADR-0007, ADR-0010).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: cd backend && poetry sync && cd ../frontend && npm ci
      - run: make lint typecheck

  test:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: cd backend && poetry sync && cd ../frontend && npm ci
      - run: make test test-web

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: cd backend && poetry sync
      - run: make test-int

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: make install
      - run: make e2e

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v3
      - run: cd backend && poetry sync && cd ../frontend && npm ci
      - run: make audit
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build-image:
    needs: [integration, e2e, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t developer-myself:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: developer-myself:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
