repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # Hooks locais: rodam no venv/node_modules do projeto para enxergar as dependências reais.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && poetry run ruff format --check src tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff
        name: ruff check
        entry: bash -c 'cd backend && poetry run ruff check src tests'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict
        entry: bash -c 'cd backend && poetry run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: poetry-check
        name: poetry check --lock
        entry: bash -c 'cd backend && poetry check --lock'
        language: system
        files: ^backend/(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
      - id: biome
        name: biome check
        entry: bash -c 'cd frontend && npx biome check .'
        language: system
        files: ^frontend/.*\.(ts|tsx|json|css)$
        pass_filenames: false
